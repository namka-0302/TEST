
version: '3.8'

services:
  # 1. Giao diện Frontend (Cái chúng ta đang viết)
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html
    environment:
      - API_URL=http://your-server-ip:5000/api
    depends_on:
      - backend

  # 2. API Backend (Cần viết thêm bằng Node.js/Python để lưu DB)
  backend:
    image: my-quiz-backend:latest
    ports:
      - "5000:5000"
    environment:
      - DB_URI=mongodb://db:27017/quizmaster
    depends_on:
      - db

  # 3. Cơ sở dữ liệu (Nơi lưu trữ thật sự để máy thầy & trò nhìn thấy nhau)
  db:
    image: mongo:latest
    volumes:
      - quiz_data:/data/db

volumes:
  quiz_data:
