        /* Tối ưu hóa cho vùng an toàn của iPhone (Notch & Home Indicator) */

        }
        body {
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            -webkit-tap-highlight-color: transparent;

            height: 100%;
        }

            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
